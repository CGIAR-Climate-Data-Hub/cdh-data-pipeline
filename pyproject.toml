[project]
name = "cdh-data-pipeline"
version = "0.1.0"
description = "Shared plumbing + recipes for turning source datasets into ARCO zarr + COGs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Brayden Youngberg", email = "bjyberg1@gmail.com" }]
# Lower bounds match tested versions in uv.lock.
# zarr 3.2+ is required for v3 sharding, BloscCodec, and ObjectStore.
dependencies = [
    "dask>=2025.1.0",
    "geopandas>=1.0",  # GeoParquet 1.1: write_covering_bbox + hilbert_distance
    "geozarr-toolkit>=0.1.2,<0.2",  # pre-1.0; cap minor. Git-pinned, see [tool.uv.sources].
    "obstore>=0.9.0",
    "pyarrow>=17.0",  # parquet writer backend
    "rasterio>=1.4.0",
    "rio-vrt>=0.3.1",  # stacks per-band VRTs; mosaics come from GDAL's STACIT driver
    "rioxarray>=0.18.0",
    "rustac>=0.9.17",  # reads static STAC, writes STAC GeoParquet 1.0
    "topozarr>=0.1.5,<0.2",  # multiscale pyramids; pre-1.0
    "xproj>=0.1.0",  # CRS metadata for topozarr
    "xarray>=2025.1.0",
    "zarr>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.4.5",
    "pytest>=9.1.0",
    "ruff>=0.15.18",
    "ty>=0.0.52",
]

[tool.uv.sources]
# Released 0.1.2 writes convention schema_urls that 404: the proj repo was renamed
# (zarr-experimental/geo-proj -> zarr-conventions/proj) and the tag is v0.1, not v1.
# Fixed on main in #18 (2026-06-15), unreleased. Restore a plain version pin at 0.1.3.
geozarr-toolkit = { git = "https://github.com/zarr-developers/geozarr-toolkit", rev = "fb49f635d229d24ff4accbebbb0ca61098a606a4" }

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["cdh_data_pipeline"]
